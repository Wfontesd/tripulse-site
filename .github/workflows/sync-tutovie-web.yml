name: Sync TutoVie responsive web build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-tutovie-web
  cancel-in-progress: true

jobs:
  build-and-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub Pages repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build TutoVie from the Expo repository
        run: |
          git clone --depth 1 https://github.com/Wfontesd/4freedom.git /tmp/tutovie-source
          cd /tmp/tutovie-source
          npm install
          npm run typecheck
          npm run build:web

      - name: Replace the public TutoVie website
        run: |
          rm -rf tutovie
          mkdir -p tutovie
          cp -R /tmp/tutovie-source/dist/. tutovie/
          touch tutovie/.nojekyll
          if [ -f tutovie/index.html ]; then
            cp tutovie/index.html tutovie/404.html
          fi

      - name: Commit the generated website
        run: |
          if git diff --quiet -- tutovie; then
            echo "The published build is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tutovie
          git commit -m "Publish responsive TutoVie web build"
          git push origin HEAD:main
